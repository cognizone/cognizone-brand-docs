name: Test

# Runs the tests on Linux; does not gate publishing (publish.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # pdftotext: the PDF text and contents page-number checks are skipped without it
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: npm ci

      - run: npm test
